          },
          "potentialAction": [
            {
              "@type": "SearchAction",

                "@type": "EntryPoint",
                "urlTemplate": "https://sarohub.com/blog?search={search_term_string}"

              "query-input": "required name=search_term_string"
            }
          ],
          "inLanguage": "en-US"
